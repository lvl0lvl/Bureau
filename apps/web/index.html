<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Bureau" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Bureau</title>
    <script>
      // The theme chosen on this device, set before anything is drawn. Colours as in src/lib/theme.ts.
      (function () {
        var ground = { graph: '#ffffff', night: '#0e1626', control: '#060500', stationery: '#f4f4f1' };
        try {
          var id = localStorage.getItem('bureau.theme');
          if (id && ground[id]) {
            document.documentElement.dataset.theme = id;
            document.querySelector('meta[name="theme-color"]').setAttribute('content', ground[id]);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
